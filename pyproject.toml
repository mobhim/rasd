[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rasd"
version = "0.1.0"
description = "RASD — Arabic Threat Intelligence: evidence-graph detection of social-engineering campaigns"
requires-python = ">=3.10"
dependencies = []          # the core engine is pure standard library by design

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2"]
eval = ["scikit-learn>=1.4"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
rasd = "rasd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rasd = ["dashboard/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
